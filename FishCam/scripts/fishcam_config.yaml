# FishCam Configuration File
# This file contains all configuration parameters for the FishCam system

# Video Capture Settings
video:
  duration: 900  # Duration of each video file in seconds
  resolution: [1920,1080] #[1920,1080] #[2560, 1920] #[2032,1520]  # Video resolution [width, height] in pixels
  frameRate: 10  # Frame rate in frames per second
  quality: 'medium'  # Encoding quality: 'very_low', 'low', 'medium', 'high', 'very_high'
  format: 'h264'  # Video format: 'h264' or 'mjpeg'

# Camera Control Settings
camera:
  # Image Quality Adjustments
  sharpness: 1.0  # Sharpness level: 0.0 to 16.0, default: 1.0
  contrast: 1.0  # Contrast level: 0.0 to 32.0, default: 1.0
  brightness: 0.0  # Brightness level: -1.0 to 1.0, default: 0.0
  saturation: 1.0  # Saturation level: 0.0 to 32.0, default: 1.0

  # Gain and Exposure
  AnalogueGain: 8.0  # Analogue gain (replaces ISO): 1.0 to 16.0
  AeEnable: true  # Auto Exposure: true (enabled) or false (disabled)
  AeExposureMode: 0  # Auto Exposure Mode: 0=Normal, 1=Short, 2=Long, 3=Custom

  # White Balance
  AwbEnable: true  # Auto White Balance: true (enabled) or false (disabled)
  AwbMode: 0  # AWB Mode: 0=Auto, 1=Tungsten, 2=Fluorescent, 3=Indoor, 4=Daylight, 5=Cloudy, 6=Custom

  # Image Orientation
  vflip: false  # Vertical flip: true or false
  hflip: false  # Horizontal flip: true or false

# Network Settings
network:
  wifi_auto_connect: true   # Automatically connect to WiFi on boot / when entering config mode
  wifi_ssid: "FishcamNetwork"  # WiFi network name (SSID)
  wifi_password: "Fi$hCam2000"  # WiFi password

# Buzzer Settings
# Each FishCam unit has a unique beep_count so recordings can be identified by ear.
# The buzzer fires at each time listed in trigger_times every day.
buzzer:
  enabled: true  # Enable/disable buzzer functionality
  pin: 26  # GPIO pin number for buzzer (BCM numbering)

  # Times of day to trigger beep sequences (24-hour HH:MM format)
  trigger_times:
    - "08:00"
    - "12:00"
    - "16:00"

  beep_count: 14              # Beeps per sequence — set uniquely per fishcam unit
  beep_duration_sec: 0.1      # Duration of each beep in seconds
  beep_gap_sec: 0.1           # Silence between beeps within a sequence
  number_sequences: 5         # How many sequences to play per trigger
  gap_between_sequences_sec: 5  # Gap between repeated sequences in seconds

# Power Saving Mode Settings
power_saving:
  enabled: true  # Enable(true)/disable(false) power saving mode (requires reed switch hardware)
  reed_switch_pin: 24  # GPIO pin for reed switch (BCM numbering, right side of Pi)
  led_pin: 23  # GPIO pin for status LED (BCM numbering, right side of Pi)
  check_interval: 2.0  # How often to check reed switch state (seconds)

  # CPU Frequency Control (in MHz)
  # Pi Zero 2W range: 600 MHz (low) to 1000 MHz (high), overclockable to 1200 MHz
  cpu_freq_power_saving: 800  # CPU frequency in power saving mode (600-1000 MHz)
  cpu_freq_config: 1000  # CPU frequency in config mode (600-1000 MHz)

  # Component-specific power saving controls
  # Each component can be individually enabled/disabled
  components:
    disable_wifi: true  # Disable WiFi in power saving mode (~40-50 mA savings)
    disable_bluetooth: true  # Disable Bluetooth in power saving mode (~10-15 mA savings)
    disable_hdmi: false  # Disable HDMI output in power saving mode (~20-30 mA savings)
    disable_usb: false  # Enable USB autosuspend in power saving mode (~20-30 mA savings)
    throttle_cpu: true  # Throttle CPU frequency (1000 MHz -> 800 MHz) (~50-100 mA savings)
    stop_services: true  # Stop non-essential services (~10-20 mA savings)
    disable_led_triggers: false  # Disable activity LED triggers (minimal savings)

# IMU Settings (Adafruit BNO085 via I2C)
# Wiring: VIN→3.3V (Pin 1), GND→GND (Pin 6), SDA→GPIO2 (Pin 3), SCL→GPIO3 (Pin 5)
# Data volume: ~47 MB/hour at 50 Hz with all reports enabled
imu:
  enabled: true                 # Enable/disable IMU data acquisition
  i2c_address: 0x4A             # I2C address (0x4A default, 0x4B if ADDR pin is high)
  sample_rate_hz: 1             # Sampling rate in Hz (min: 1 Hz, max: 50 Hz — BNO085 hardware limits)

  # Sensor reports to record (disable unused ones to reduce file size)
  reports:
    accelerometer: false         # Raw accelerometer (m/s²)
    gyroscope: false             # Gyroscope (rad/s)
    magnetometer: false          # Magnetometer (µT)
    rotation_vector: true        # Fused orientation as quaternion (i, j, k, real)
    linear_acceleration: false   # Acceleration with gravity removed (m/s²)
    gravity: false               # Gravity vector (m/s²)

# WittyPi Settings
wittypi:
  install_dir: '/home/fishcam/Desktop/wittypi'  # WittyPi installation directory (scripts + logs)
  i2c_address: 0x08                             # WittyPi v4 mini fixed I2C address
  power_cut_delay_sec: 60                       # seconds WittyPi waits after SIGTERM before hard power cut
                                                # must be long enough for a clean Pi shutdown (~15s) + margin

  # Voltage protection — set both to 0 to disable (e.g. mains-powered units)
  low_voltage_cutoff_v: 0              # hard power cut if Vin drops below this (e.g. 5.8 for LiPo)
  recovery_voltage_v: 0               # won't power on again until Vin exceeds this (e.g. 6.2)

  # Deployment timezone — Pi must always run UTC; times below are in this local timezone.
  # Must be a valid IANA timezone name (e.g. "America/Vancouver", "Pacific/Auckland").
  # https://timeapi.io/documentation/iana-timezones
  # Run configure_wittypi.py for validation — it will suggest the closest name if unrecognized.
  timezone: "America/Vancouver"

  # Deployment window (local time in the timezone above)
  deployment:
    start: "2026-08-01 06:00:00"
    end:   "2026-09-30 23:59:59"

  # Daily power cycle
  # anchor_time: local time of day where the 24-hour sequence restarts each day
  # windows: must sum to exactly 24 hours
  # on_min/off_min: duration of each ON and OFF period within the window
  # Set off_min: 0 for continuous recording during a window
  daily_schedule:
    anchor_time: "06:00"
    windows:
      - name: "daytime"
        duration_hours: 14             # 06:00 → 20:00 local
        on_min: 15
        off_min: 45
      - name: "nighttime"
        duration_hours: 10             # 20:00 → 06:00 local
        on_min: 5
        off_min: 115

# File Paths and Directories
paths:
  video_dir: '../data/video'   # Directory for video files
  log_dir: '../data/logs'     # Directory for log files
  imu_dir: '../data/imu'      # Directory for IMU CSV files
  gps_dir: '../data/gps'      # Directory for GPS files (future)