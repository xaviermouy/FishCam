<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FishCam Dashboard</title>
<style>
  /* ── Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #1a1a1a;
    --card:   #2d2d2d;
    --border: #404040;
    --text:   #e0e0e0;
    --muted:  #a0a0a0;
    --green:  #4caf50;
    --yellow: #ff9800;
    --red:    #f44336;
    --grey:   #757575;
    --blue:   #2196f3;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 16px;
  }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 10px;
  }
  .page-header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #countdown {
    color: var(--muted);
    font-size: 13px;
  }

  /* ── Subnet bar ── */
  .subnet-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .subnet-bar label {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }
  .subnet-bar input {
    background: #2a2a2a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    width: 140px;
    font-family: monospace;
  }
  .subnet-bar input:focus { outline: none; border-color: var(--blue); }
  #subnet-status {
    color: var(--muted);
    font-size: 12px;
  }

  /* ── Buttons ── */
  button {
    background: #3a3a3a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  button:hover  { background: #4a4a4a; }
  button:active { background: #555; }
  button.primary {
    background: var(--blue);
    border-color: var(--blue);
  }
  button.primary:hover { background: #1976d2; }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }

  /* ── Card ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card.offline { opacity: 0.5; }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: #333;
  }
  .card-header .fishcam-id {
    font-weight: 700;
    font-size: 16px;
  }
  .card-header .last-updated {
    font-size: 12px;
    color: var(--muted);
  }
  .offline-badge {
    background: var(--grey);
    color: #fff;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 600;
  }

  .card-body { padding: 12px 16px; }

  /* ── Section ── */
  .section { margin-bottom: 12px; }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .section-rows { display: flex; flex-direction: column; gap: 4px; }

  /* ── Row ── */
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .row-label {
    width: 110px;
    flex-shrink: 0;
    color: var(--muted);
    font-size: 12px;
  }
  .row-value { flex: 1; }

  /* ── Dot / Status ── */
  .dot { font-size: 10px; }
  .green  { color: var(--green); }
  .yellow { color: var(--yellow); }
  .red    { color: var(--red); }
  .grey   { color: var(--grey); }
  .muted  { color: var(--muted); }

  /* ── Disk bar ── */
  .disk-bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .disk-bar {
    flex: 1;
    height: 6px;
    background: #555;
    border-radius: 3px;
    overflow: hidden;
  }
  .disk-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }

  /* ── Sync result ── */
  .sync-result {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    word-break: break-word;
  }
  .sync-result.ok  { color: var(--green); }
  .sync-result.err { color: var(--red); }

  /* ── Divider ── */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }

  /* ── Empty / discovering state ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state h2 { margin-bottom: 8px; }

  .discovering-bar {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── Spinner ── */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="page-header">
  <h1>FishCam Dashboard</h1>
  <div class="header-controls">
    <span id="countdown">Detecting network…</span>
    <button onclick="manualRefresh()">Refresh</button>
  </div>
</div>

<div class="subnet-bar">
  <label for="subnet-input">Subnet:</label>
  <input id="subnet-input" type="text" placeholder="e.g. 192.168.43" />
  <button onclick="manualScan()">Scan</button>
  <span id="subnet-status"></span>
</div>

<div class="grid" id="grid">
  <div class="empty-state">
    <div class="spinner"></div>
    <p style="margin-top:12px">Detecting network…</p>
  </div>
</div>

<script>
'use strict';

// ── Configuration ────────────────────────────────────────────────────────────
const API_PORT         = 5000;
const REFRESH_INTERVAL = 15;    // seconds between auto-refreshes
const SCAN_TIMEOUT_MS  = 1500;  // per-host timeout for subnet scan
const MDNS_TIMEOUT_MS  = 3000;  // per-host timeout for .local probes (mDNS needs more time)
const MDNS_MAX_UNIT    = 20;    // probe fishcam01.local … fishcam20.local

// ── State ────────────────────────────────────────────────────────────────────
let discovered    = {};   // { host: { online, data, host } }  host = IP or hostname
let currentPrefix = null;
let usingMdns     = false;  // true when discovered via .local hostnames
let countdownVal  = REFRESH_INTERVAL;
let countdownTimer;
let scanning      = false;

// ── Generic host probe ────────────────────────────────────────────────────────
// host can be an IP address or a hostname (e.g. fishcam01.local)
async function probeHost(host, timeoutMs) {
  const url  = `http://${host}:${API_PORT}/status`;
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), timeoutMs || SCAN_TIMEOUT_MS);
  try {
    const resp = await fetch(url, { signal: ctrl.signal });
    clearTimeout(tid);
    if (!resp.ok) return { online: false };
    const data = await resp.json();
    return { online: true, data, host };
  } catch {
    clearTimeout(tid);
    return { online: false };
  }
}

// ── mDNS discovery ───────────────────────────────────────────────────────────
// Probe fishcam01.local … fishcamNN.local in parallel.
// Works without knowing the subnet — relies on OS mDNS (Avahi / Bonjour).
async function probeMdnsHosts() {
  const probes = [];
  for (let i = 1; i <= MDNS_MAX_UNIT; i++) {
    const host = `fishcam${String(i).padStart(2, '0')}.local`;
    probes.push(
      probeHost(host, MDNS_TIMEOUT_MS).then(result => {
        if (result.online) {
          discovered[host] = { online: true, data: result.data, host };
          renderDiscovering(null, null);   // show units as they come in
        }
      })
    );
  }
  await Promise.allSettled(probes);
  return Object.keys(discovered).length > 0;
}

// ── Network detection (WebRTC) ────────────────────────────────────────────────
function getLocalIPPrefix() {
  return new Promise((resolve) => {
    try {
      const pc = new RTCPeerConnection({ iceServers: [] });
      pc.createDataChannel('');
      pc.createOffer().then(o => pc.setLocalDescription(o));
      const seen = new Set();
      pc.onicecandidate = (e) => {
        if (!e || !e.candidate) return;
        const m = /(\d+\.\d+\.\d+)\.\d+/.exec(e.candidate.candidate);
        if (m && !m[1].startsWith('127.')) {
          if (!seen.has(m[1])) {
            seen.add(m[1]);
            resolve(m[1]);
            pc.close();
          }
        }
      };
      setTimeout(() => resolve(null), 2500);
    } catch {
      resolve(null);
    }
  });
}

// ── Subnet scan ───────────────────────────────────────────────────────────────
async function scanSubnet(prefix) {
  scanning      = true;
  usingMdns     = false;
  currentPrefix = prefix;
  discovered    = {};

  document.getElementById('subnet-input').value = prefix;
  document.getElementById('subnet-status').textContent = '';

  let probesDone = 0;
  const total    = 254;
  renderDiscovering(0, total);

  const probes = [];
  for (let i = 1; i <= 254; i++) {
    const host = `${prefix}.${i}`;
    const p = probeHost(host).then(result => {
      probesDone++;
      if (result.online) {
        discovered[host] = { online: true, data: result.data, host };
        renderDiscovering(probesDone, total);
      } else if (probesDone % 25 === 0 || probesDone === total) {
        renderDiscovering(probesDone, total);
      }
    });
    probes.push(p);
  }

  await Promise.allSettled(probes);
  scanning = false;
  render();
}

// ── Per-unit refresh ──────────────────────────────────────────────────────────
async function refreshAll() {
  const hosts = Object.keys(discovered);
  if (hosts.length === 0) {
    // No units known — re-run full discovery
    if (usingMdns) {
      await probeMdnsHosts();
      render();
    } else if (currentPrefix) {
      await scanSubnet(currentPrefix);
    }
    return;
  }
  // Re-probe each known host (works for both IPs and .local hostnames)
  const timeout = usingMdns ? MDNS_TIMEOUT_MS : SCAN_TIMEOUT_MS;
  await Promise.allSettled(hosts.map(async host => {
    const result = await probeHost(host, timeout);
    if (result.online) {
      discovered[host] = { online: true, data: result.data, host };
    } else {
      discovered[host] = { online: false, data: discovered[host]?.data, host };
    }
  }));
  render();
}

// ── Manual subnet input ───────────────────────────────────────────────────────
function manualScan() {
  const input  = document.getElementById('subnet-input');
  const prefix = input.value.trim().replace(/\.$/, ''); // tolerate trailing dot
  if (/^\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(prefix)) {
    clearInterval(countdownTimer);
    scanSubnet(prefix).then(() => startCountdown());
  } else {
    input.style.borderColor = 'var(--red)';
    document.getElementById('subnet-status').textContent = 'Format: 192.168.x';
    setTimeout(() => {
      input.style.borderColor = '';
      document.getElementById('subnet-status').textContent = '';
    }, 2000);
  }
}

// ── Sync RTC ──────────────────────────────────────────────────────────────────
async function syncRtc(ip, btnEl, resultEl) {
  btnEl.disabled    = true;
  btnEl.textContent = 'Syncing…';
  resultEl.textContent = '';
  resultEl.className   = 'sync-result';

  try {
    const resp = await fetch(`http://${ip}:${API_PORT}/sync_rtc`, { method: 'POST' });
    const d    = await resp.json();
    const ok   = d.ntp_ok && d.rtc_ok;
    resultEl.textContent = `NTP: ${d.ntp_msg} | RTC: ${d.rtc_msg}`;
    resultEl.className   = 'sync-result ' + (ok ? 'ok' : 'err');
  } catch (e) {
    resultEl.textContent = `Error: ${e.message}`;
    resultEl.className   = 'sync-result err';
  } finally {
    btnEl.disabled    = false;
    btnEl.textContent = 'Sync Time';
  }
}

// ── Rendering helpers ─────────────────────────────────────────────────────────
function dot(color) {
  return `<span class="dot ${color}">●</span>`;
}

function fmtAge(age_s) {
  if (age_s == null) return '';
  if (age_s < 60)  return `${age_s}s ago`;
  const m = Math.floor(age_s / 60);
  const s = age_s % 60;
  return `${m}m ${s}s ago`;
}

function voltageClass(v, low_v, rec_v) {
  if (v == null) return 'grey';
  if (low_v > 0 && v < low_v) return 'red';
  if (rec_v > 0 && v < rec_v) return 'yellow';
  return 'green';
}

function diskColor(pct) {
  if (pct == null) return 'grey';
  if (pct > 90) return 'red';
  if (pct > 75) return 'yellow';
  return 'green';
}

function tempClass(t) {
  if (t == null) return 'grey';
  if (t > 80) return 'red';
  if (t > 70) return 'yellow';
  return 'green';
}

function renderCard(ip, entry) {
  const online = entry.online;
  const d      = entry.data;
  const cardId = 'card-' + ip.replace(/\./g, '-');

  if (!online && !d) return '';

  const offlineBadge = !online
    ? `<span class="offline-badge">Offline</span>`
    : '';

  const lastUpdated = d?.time
    ? `<span class="last-updated">${d.time}</span>`
    : `<span class="last-updated">-</span>`;

  const fishcamLabel = d?.fishcam_id || ip;

  let body = '';

  if (d) {
    // ── PROCESSES ──
    const procRows = (d.processes || []).map(p => {
      const color  = p.running ? 'green' : 'red';
      const detail = p.running
        ? `PID ${p.pid} &nbsp; up ${p.uptime}`
        : 'STOPPED';
      return `<div class="row">
        <span class="row-label">${p.label}</span>
        <span class="row-value">${dot(color)} ${detail}</span>
      </div>`;
    }).join('');

    // ── ACQUISITION ──
    const acq     = d.acquisition || {};
    const procMap = {};
    (d.processes || []).forEach(p => { procMap[p.label] = p.running; });

    function acqRow(key, label, procLabel) {
      const info    = acq[key] || {};
      const active  = info.active;
      const age_s   = info.age_s;
      const running = procMap[procLabel] || false;
      let color, detail;
      if (active) {
        color  = 'green';
        detail = 'ACTIVE &nbsp; ' + fmtAge(age_s);
      } else if (running) {
        color  = 'red';
        detail = 'INACTIVE &nbsp; ' + (age_s != null ? fmtAge(age_s) : 'no recent file');
      } else {
        color  = 'grey';
        detail = 'STOPPED';
      }
      return `<div class="row">
        <span class="row-label">${label}</span>
        <span class="row-value">${dot(color)} ${detail}</span>
      </div>`;
    }
    const acqRows = acqRow('video', 'Video', 'Video')
                  + acqRow('imu',   'IMU',   'IMU');

    // ── BUZZER ──
    const bz = d.buzzer || {};
    let buzzerContent = '';
    if (!bz.enabled) {
      buzzerContent = `<span class="yellow">DISABLED</span>`;
    } else {
      const nextColor = (bz.next_in_min != null && bz.next_in_min > 5) ? 'green' : 'yellow';
      const nextStr   = bz.next_local
        ? `${bz.next_local} local${bz.next_utc ? ' / ' + bz.next_utc + ' UTC' : ''}` +
          (bz.next_in_min != null ? ` (in ${bz.next_in_min.toFixed(1)}m)` : '')
        : '-';
      const lastStr  = bz.last_local
        ? `${bz.last_local} local${bz.last_utc ? ' / ' + bz.last_utc + ' UTC' : ''}`
        : '-';
      buzzerContent = `
        <div class="row">
          <span class="row-label">Next</span>
          <span class="row-value ${nextColor}">${nextStr}</span>
        </div>
        <div class="row">
          <span class="row-label">Last</span>
          <span class="row-value">${lastStr}</span>
        </div>`;
    }

    // ── HARDWARE ──
    const cam    = Array.isArray(d.camera)  ? d.camera  : [null, '?'];
    const imu    = Array.isArray(d.imu_bus) ? d.imu_bus : [null, '?'];
    const camOk  = cam[0];
    const camStr = cam[1] || '?';
    const imuOk  = imu[0];
    const imuStr = imu[1] || '?';

    const camColor = camOk === true ? 'green' : camOk === false ? 'red' : 'yellow';
    const imuColor = imuOk === true ? 'green' : imuOk === false ? 'red' : 'yellow';
    const camSym   = camOk === true ? '✓' : camOk === false ? '✗' : '?';
    const imuSym   = imuOk === true ? '✓' : imuOk === false ? '✗' : '?';

    const v      = d.voltage;
    const lowV   = d.voltage_low_v || 0;
    const recV   = d.voltage_rec_v || 0;
    const vClass = voltageClass(v, lowV, recV);
    const vStr   = v != null ? `${v.toFixed(1)} V` : 'n/a';
    const vThresh = lowV > 0
      ? `(cutoff ${lowV}V / recovery ${recV}V)`
      : '(protection disabled)';

    // ── SYSTEM ──
    const temp   = d.cpu_temp;
    const tClass = tempClass(temp);
    const tStr   = temp != null ? `${temp.toFixed(1)}°C` : 'n/a';
    const st     = d.storage || {};
    const pct    = st.pct;
    const dColor = diskColor(pct);
    const dStr   = (st.used_gb != null && st.total_gb != null)
      ? `${st.used_gb.toFixed(1)} / ${st.total_gb.toFixed(0)} GB (${pct != null ? pct.toFixed(0) : '?'}%)`
      : 'unavailable';
    const fillPct  = pct != null ? Math.min(100, pct) : 0;
    const vidCount = st.video_count != null ? `${st.video_count} video files` : '';
    const imuCount = st.imu_count   != null ? ` / ${st.imu_count} IMU files`  : '';

    // ── IMU READINGS ──
    const imuR = d.imu_data;
    let imuReadingsContent = '';
    if (!imuR) {
      imuReadingsContent = '<div class="row muted">No IMU data yet</div>';
    } else {
      const fmtDeg = v => v != null ? `${v.toFixed(1)}°` : '—';
      const fmtVec = (vec, unit, dec) => vec
        ? vec.map(v => v != null ? (v >= 0 ? '+' : '') + v.toFixed(dec) : '—').join('  ') + `  <span class="muted">${unit}</span>`
        : '—';
      const ageStr = imuR.age_s != null ? fmtAge(imuR.age_s) : '';
      imuReadingsContent = `
        <div class="row">
          <span class="row-label">Heading</span>
          <span class="row-value">${fmtDeg(imuR.heading)} <span class="muted" style="font-size:11px">${ageStr}</span></span>
        </div>
        <div class="row">
          <span class="row-label">Pitch</span>
          <span class="row-value">${fmtDeg(imuR.pitch)}</span>
        </div>
        <div class="row">
          <span class="row-label">Roll</span>
          <span class="row-value">${fmtDeg(imuR.roll)}</span>
        </div>`;
      if (imuR.accel) imuReadingsContent += `
        <div class="row">
          <span class="row-label">Accel</span>
          <span class="row-value" style="font-family:monospace;font-size:12px">${fmtVec(imuR.accel, 'm/s²', 2)}</span>
        </div>`;
      if (imuR.gyro) imuReadingsContent += `
        <div class="row">
          <span class="row-label">Gyro</span>
          <span class="row-value" style="font-family:monospace;font-size:12px">${fmtVec(imuR.gyro, 'rad/s', 3)}</span>
        </div>`;
      if (imuR.mag) imuReadingsContent += `
        <div class="row">
          <span class="row-label">Mag</span>
          <span class="row-value" style="font-family:monospace;font-size:12px">${fmtVec(imuR.mag, 'µT', 1)}</span>
        </div>`;
    }

    // ── LOG ERRORS ──
    const errorLogs = (d.logs || []).filter(l => l.err_1h > 0);
    const errorRows = errorLogs.length === 0
      ? '<div class="row muted">No errors in last hour</div>'
      : errorLogs.map(l =>
          `<div class="row">
            <span class="row-label">${l.name}</span>
            <span class="row-value red">${l.err_1h} error${l.err_1h > 1 ? 's' : ''}/hr</span>
          </div>`
        ).join('');

    body = `
      <section class="section">
        <div class="section-label">Processes</div>
        <div class="section-rows">${procRows}</div>
      </section>
      <hr class="divider">
      <section class="section">
        <div class="section-label">Acquisition</div>
        <div class="section-rows">${acqRows}</div>
      </section>
      <hr class="divider">
      <section class="section">
        <div class="section-label">Buzzer</div>
        <div class="section-rows">${buzzerContent}</div>
      </section>
      <hr class="divider">
      <section class="section">
        <div class="section-label">Hardware</div>
        <div class="section-rows">
          <div class="row">
            <span class="row-label">Camera</span>
            <span class="row-value ${camColor}">${camSym} ${camStr}</span>
          </div>
          <div class="row">
            <span class="row-label">IMU I2C</span>
            <span class="row-value ${imuColor}">${imuSym} ${imuStr}</span>
          </div>
          <div class="row">
            <span class="row-label">Voltage</span>
            <span class="row-value ${vClass}">${vStr} <span class="muted" style="font-size:11px">${vThresh}</span></span>
          </div>
        </div>
      </section>
      <hr class="divider">
      <section class="section">
        <div class="section-label">IMU Readings</div>
        <div class="section-rows">${imuReadingsContent}</div>
      </section>
      <hr class="divider">
      <section class="section">
        <div class="section-label">System</div>
        <div class="section-rows">
          <div class="row">
            <span class="row-label">CPU Temp</span>
            <span class="row-value ${tClass}">${tStr}</span>
          </div>
          <div class="row">
            <span class="row-label">Disk</span>
            <span class="row-value">
              <div class="disk-bar-wrap">
                <div class="disk-bar">
                  <div class="disk-bar-fill ${dColor}" style="width:${fillPct}%; background:var(--${dColor})"></div>
                </div>
                <span class="${dColor}">${dStr}</span>
              </div>
            </span>
          </div>
          <div class="row">
            <span class="row-label">Uptime</span>
            <span class="row-value">${d.uptime || '-'}</span>
          </div>
          <div class="row">
            <span class="row-label">Files</span>
            <span class="row-value muted">${vidCount}${imuCount}</span>
          </div>
        </div>
      </section>
      <hr class="divider">
      <section class="section">
        <div class="section-label">Log Errors (last hour)</div>
        <div class="section-rows">${errorRows}</div>
      </section>
      <hr class="divider">
      <section class="section">
        <button class="primary" onclick="handleSync('${ip}', this)">Sync Time</button>
        <div class="sync-result" id="sync-result-${cardId}"></div>
      </section>
    `;
  }

  return `
    <div class="card ${online ? '' : 'offline'}" id="${cardId}">
      <div class="card-header">
        <span class="fishcam-id">${fishcamLabel}</span>
        <div style="display:flex;align-items:center;gap:8px">
          ${lastUpdated}
          ${offlineBadge}
        </div>
      </div>
      <div class="card-body">${body}</div>
    </div>`;
}

function renderDiscovering(done, total) {
  const grid      = document.getElementById('grid');
  const foundKeys = Object.keys(discovered);
  const cards     = foundKeys.map(ip => renderCard(ip, discovered[ip])).join('');

  const progress = (done != null && total != null)
    ? `Scanning ${done} / ${total} addresses…`
    : 'Scanning…';
  const foundNote = foundKeys.length > 0
    ? `<span style="color:var(--green)">${foundKeys.length} unit${foundKeys.length > 1 ? 's' : ''} found</span> &nbsp;`
    : '';

  const bar = `<div class="discovering-bar">${foundNote}<span class="spinner"></span> ${progress}</div>`;
  grid.innerHTML = cards + bar;
}

function render() {
  const grid = document.getElementById('grid');
  const keys = Object.keys(discovered);

  if (keys.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <h2>No FishCam units found</h2>
        <p>Make sure units are powered on, connected to WiFi, and the API is running on port ${API_PORT}.</p>
        <p style="margin-top:8px;font-size:12px">Subnet scanned: ${currentPrefix || '—'}.x</p>
      </div>`;
    return;
  }

  grid.innerHTML = keys.map(ip => renderCard(ip, discovered[ip])).join('');
}

// ── Sync button handler ───────────────────────────────────────────────────────
function handleSync(ip, btnEl) {
  const cardId   = 'card-' + ip.replace(/\./g, '-');
  const resultEl = document.getElementById(`sync-result-${cardId}`);
  syncRtc(ip, btnEl, resultEl);
}

// ── Countdown + auto-refresh ──────────────────────────────────────────────────
function startCountdown() {
  clearInterval(countdownTimer);
  countdownVal = REFRESH_INTERVAL;
  updateCountdown();

  countdownTimer = setInterval(() => {
    countdownVal--;
    updateCountdown();
    if (countdownVal <= 0) {
      clearInterval(countdownTimer);
      document.getElementById('countdown').textContent = 'Refreshing…';
      refreshAll().finally(() => startCountdown());
    }
  }, 1000);
}

function updateCountdown() {
  document.getElementById('countdown').textContent = `Refreshing in ${countdownVal}s`;
}

function manualRefresh() {
  clearInterval(countdownTimer);
  document.getElementById('countdown').textContent = 'Refreshing…';
  refreshAll().finally(() => startCountdown());
}

// ── Bootstrap ────────────────────────────────────────────────────────────────

// Common hotspot subnets to try when WebRTC detection fails.
// Android uses 192.168.43.x, iPhone uses 172.20.10.x.
// A subnet is accepted if at least one IP responds on API_PORT.
const FALLBACK_PREFIXES = ['192.168.43', '172.20.10'];

async function quickProbe(prefix) {
  // Probe a few IPs on the subnet to see if any fishcam responds.
  // Uses IPs 1–20 as a fast check — avoids a full 254-IP scan just to detect.
  const probes = [];
  for (let i = 1; i <= 20; i++) {
    probes.push(probeHost(`${prefix}.${i}`));
  }
  const results = await Promise.allSettled(probes);
  return results.some(r => r.status === 'fulfilled' && r.value.online);
}

(async function init() {
  document.getElementById('countdown').textContent = 'Detecting…';

  // 1. If served from a Pi (http://fishcamXX.local:5000/), call /self to get
  //    the Pi's LAN IP — same-origin fetch, always works, no CORS/mDNS needed.
  //    Browsers block .local resolution inside fetch(), so we use IPs instead.
  if (/fishcam/i.test(window.location.hostname)) {
    document.getElementById('grid').innerHTML = `
      <div class="empty-state">
        <div class="spinner"></div>
        <p style="margin-top:12px">Detecting subnet from serving unit…</p>
      </div>`;
    try {
      const selfResp = await fetch('/self');
      if (selfResp.ok) {
        const self = await selfResp.json();
        const prefix = self.ip.split('.').slice(0, 3).join('.');
        document.getElementById('subnet-status').textContent = `(${self.ip})`;
        await scanSubnet(prefix);
        startCountdown();
        return;
      }
    } catch {}
  }

  // 2. Fallback: try WebRTC subnet auto-detection (works when not served from Pi)
  document.getElementById('grid').innerHTML = `
    <div class="empty-state">
      <div class="spinner"></div>
      <p style="margin-top:12px">Detecting subnet…</p>
    </div>`;

  const detected = await getLocalIPPrefix();
  if (detected) {
    document.getElementById('subnet-status').textContent = '(auto-detected)';
    await scanSubnet(detected);
    startCountdown();
    return;
  }

  // 3. WebRTC failed — try known hotspot subnets
  document.getElementById('subnet-status').textContent = 'Trying common subnets…';
  document.getElementById('grid').innerHTML = `
    <div class="empty-state">
      <div class="spinner"></div>
      <p style="margin-top:12px">WebRTC detection unavailable — trying common hotspot subnets…</p>
    </div>`;

  for (const prefix of FALLBACK_PREFIXES) {
    document.getElementById('subnet-status').textContent = `Trying ${prefix}.x…`;
    const found = await quickProbe(prefix);
    if (found) {
      document.getElementById('subnet-status').textContent = `(matched ${prefix}.x)`;
      await scanSubnet(prefix);
      startCountdown();
      return;
    }
  }

  // 4. Nothing found automatically — prompt for manual input
  document.getElementById('subnet-status').textContent = 'Not detected';
  document.getElementById('grid').innerHTML = `
    <div class="empty-state">
      <h2>No FishCam units found</h2>
      <p>mDNS scan (fishcamXX.local) and subnet detection both failed.</p>
      <p style="margin-top:8px">Make sure units are powered on and on the same network,<br>
         or enter your subnet manually and tap <strong>Scan</strong>.</p>
      <p style="margin-top:10px;font-size:12px;color:var(--muted)">
        Android hotspot: <strong>192.168.43</strong><br>
        iPhone hotspot: <strong>172.20.10</strong><br>
        Laptop (check with <code>ipconfig</code> / <code>ifconfig</code>)
      </p>
    </div>`;
  document.getElementById('subnet-input').focus();
  // No startCountdown() — wait for user to scan manually
})();
</script>
